# 語義キュレーション + L3ピン(発注者が自由に追記するファイル)
#
# 運用: 読んでいて「この語は分野内でも多義だ/拾われるべきなのに拾われていない」と
# 気づいたらここに追記する。ビルド時に bake がマージし、登録語は分布判定と無関係に
# L3 として vocab_table に収載される(キュレーション・ピン)。
#
# ルール(Phase 2a レビュー承認条件):
#   - pinReason は必須。「なぜ登録するか」を書く(検出失敗によるピンか、語義データ目的かを区別)。
#   - ピンのみ(=アルゴリズム検出失敗)の語は eval_report.md に恒久記録される。
#   - ここに無い語は自動的に <word>#default の単一語義として扱われる。
#
# 表示仕様(phase2b_ui_review.md 修正1):
#   domainSense(英語・短く)= デフォルト表示。読解のヒントとして機能する長さに
#   jaGeneral(一般・日本語)/ ja(分野・日本語)= タップで開く。一行で刺さる対比を優先

mass:
  pinReason: "C構成がR重心のため確率質量の信号が不安定(現ビルドでは検出済み。語義データ目的も兼ねる)"
  senses:
    - id: mass#ml
      domainSense: "probability mass — total probability assigned to a region"
      contrast: "not physical mass — a share of probability"
      jaGeneral: "質量、大量の"
      ja: "確率質量(ある領域に割り当てられた確率の総量)"
    - id: mass#phys
      domainSense: "physical mass (dynamics, inertia)"
      contrast: "(一般語義と同じ)"
      jaGeneral: "質量"
      ja: "質量(cs.RO の動力学文脈。一般語義と同じ)"

prior:
  pinReason: "検出済み(語義データ目的)。品詞で語義が割れる代表例"
  senses:
    - id: prior#bayes
      domainSense: "prior distribution — belief before observing data"
      contrast: "not 'previous' — a probability distribution (noun)"
      jaGeneral: "前の、以前の"
      ja: "事前分布(データを見る前の信念を表す確率分布)"
    - id: prior#adj
      domainSense: "previous, earlier (prior work)"
      contrast: "(一般語義と同じ。形容詞用法)"
      jaGeneral: "前の、以前の"
      ja: "以前の(prior work = 先行研究。一般語義と同じ)"

curriculum:
  pinReason: "検出済み(語義データ目的)。発注者UI確認で本命指定 — 日常の意味で読むと確実に誤読する"
  senses:
    - id: curriculum#rl
      domainSense: "curriculum learning — gradually increasing task difficulty"
      contrast: "not a school curriculum — a training schedule from easy to hard"
      jaGeneral: "教育課程"
      ja: "簡単な課題から段階的に難しくする学習方式(カリキュラム学習)"

disturbance:
  pinReason: "検出済み(語義データ目的)。制御読者には既知だが対比例として発注者指定"
  senses:
    - id: disturbance#ctrl
      domainSense: "external disturbance — unexpected input acting on the system"
      contrast: "not annoyance — an external input to be rejected"
      jaGeneral: "邪魔、妨害"
      ja: "外乱(制御対象に加わる予期しない入力)"

actor:
  pinReason: "検出済み(語義データ目的)。一般語義「俳優」との対比が典型"
  senses:
    - id: actor#rl
      domainSense: "the policy network in Actor-Critic methods"
      contrast: "not a performer — the action-producing half of Actor-Critic"
      jaGeneral: "俳優"
      ja: "Actor-Critic の行動側。方策を出力するネットワーク"

# --- 2026-08-13 抜き取り検査を受けた追加(発注者確定済み・修正不要) ---
# 多義3語: 生成結果を cs.RO 側語義として保持し、cs.LG 側を追加(生成を捨てない)

tight:
  pinReason: "検出済み(語義キュレーション: cs.LG=bound / cs.RO=公差 で語義が割れる。抜き取り検査)"
  senses:
    - id: tight#bound
      domainSense: "a bound close to the true value (tight bound)"
      contrast: "not snug — the inequality is nearly an equality"
      jaGeneral: "きつい"
      ja: "上界が真値に近い(tight bound)。理論解析で「無駄のない」評価"
    - id: tight#tol
      domainSense: "small tolerance or narrow margin in mechanical/control specs"
      contrast: "not snug — stringent numerical constraints"
      jaGeneral: "きつい、ぴっちりした"
      ja: "公差・許容誤差が小さい(tight tolerance / tight coupling。cs.RO側の用法)"

flat:
  pinReason: "検出済み(語義キュレーション: cs.LG=minima / cs.RO=地形 で語義が割れる。抜き取り検査)"
  senses:
    - id: flat#minima
      domainSense: "flat minima — wide low-loss region linked to generalization"
      contrast: "not level ground — a property of the loss landscape"
      jaGeneral: "平らな"
      ja: "flat minima。損失地形の平坦な谷。汎化性能と結びつく性質(cs.LG)"
    - id: flat#terrain
      domainSense: "terrain or surface without slope or curvature"
      contrast: "(一般語義に近い)"
      jaGeneral: "平らな、フラットな"
      ja: "平坦な地面・環境(傾斜なし。cs.RO の移動タスク)"

collapse:
  pinReason: "検出済み(語義キュレーション: cs.LG=mode collapse / cs.RO=機能崩壊 で語義が割れる。抜き取り検査)"
  senses:
    - id: collapse#mode
      domainSense: "mode/representation collapse — diversity or dimensions degenerate"
      contrast: "not physical breakdown — outputs or features become uniform"
      jaGeneral: "崩壊する"
      ja: "mode collapse / representation collapse。多様性や次元が潰れる現象(cs.LG)"
    - id: collapse#fail
      domainSense: "failure or breakdown preventing system functionality"
      contrast: "(一般語義に近い)"
      jaGeneral: "崩壊、倒壊、破綻"
      ja: "構造・機能の崩壊。制御の破綻など機能喪失に至る故障状態(cs.RO)"

# 単一上書き3語(素直な取りこぼし)

demonstration:
  pinReason: "検出済み(語義キュレーション: 生成が模倣学習の語義を外したため上書き。抜き取り検査)"
  senses:
    - id: demonstration#il
      domainSense: "expert trajectory data used for imitation learning"
      contrast: "not a demo — the teaching data itself (learning from demonstrations)"
      jaGeneral: "デモ、実演"
      ja: "模倣学習の教師軌道データそのもの(learning from demonstrations)"

hard:
  pinReason: "検出済み(語義キュレーション: 生成がNP困難を選び hard negative を外したため上書き。抜き取り検査)"
  senses:
    - id: hard#negative
      domainSense: "hard negative — a confusing negative example chosen on purpose"
      contrast: "not difficult in general — a deliberately misleading training sample"
      jaGeneral: "難しい、硬い"
      ja: "hard negative(対照学習で意図的に選ぶ紛らわしい負例)"

anchor:
  pinReason: "検出済み(語義キュレーション: 生成がViT/GNN基準点を選び対照学習を外したため上書き。抜き取り検査)"
  senses:
    - id: anchor#contrastive
      domainSense: "the reference sample in contrastive learning (anchor-positive-negative)"
      contrast: "not a ship's anchor — the comparison baseline sample"
      jaGeneral: "錨"
      ja: "対照学習における基準サンプル(anchor-positive-negative の anchor)"

# --- 2026-08-13 実地検証1本目(FM-VLA)で発見した生成誤りの修正(発注者ドラフト) ---

conditioning:
  pinReason: "生成誤りの上書き(生成は正規化/preconditioningの説明を書いた。実地検証1本目で発見)。L3本命級 — 日常の「条件づけ」からズレ、誤解すると論文主旨を取り違える"
  senses:
    - id: conditioning#ctx
      domainSense: "providing X as input context that the model's output depends on"
      contrast: "not normalization — feeding X in so the output depends on it"
      jaGeneral: "調整、条件づけ"
      ja: "何かを条件として与えること。conditioning on X = X を入力として与え、それに応じた出力を生成させる"
