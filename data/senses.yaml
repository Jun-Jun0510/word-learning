# 語義キュレーション(発注者が自由に追記するファイル)
#
# 運用: 読んでいて「この語は分野内でも多義だ」と気づいたらここに追記する。
# ビルド時に bake がこの内容を vocab_table.json の senses にマージする(Phase 2b で実装)。
# ここに無い語は自動的に <word>#default の単一語義として扱われる。
#
# 形式:
#   語:
#     - id: 語#短いslug
#       domainSense: 分野での意味(英語)
#       contrast: 一般語義との対比の一行(L3の肝)
#       ja: 日本語ラベル(トグル表示用)

mass:
  - id: mass#ml
    domainSense: "probability mass — the total probability assigned to a region or outcome"
    contrast: "not physical mass — a share of probability, nothing to do with kilograms"
    ja: "確率質量"
  - id: mass#phys
    domainSense: "physical mass in dynamics (inertia, kg)"
    contrast: "(一般語義と同じ。cs.RO の動力学文脈)"
    ja: "質量"

prior:
  - id: prior#bayes
    domainSense: "prior distribution — belief before observing data"
    contrast: "not 'previous' — a probability distribution (noun)"
    ja: "事前分布"
  - id: prior#adj
    domainSense: "prior (adjective) — previous, earlier (prior work)"
    contrast: "(一般語義と同じ。形容詞用法)"
    ja: "以前の"
